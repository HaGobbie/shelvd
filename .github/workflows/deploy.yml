name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Store logos are committed to this folder by the upload-store-logo Edge
    # Function and served straight from raw.githubusercontent.com, so a push
    # that ONLY touches them doesn't need a rebuild/redeploy of the site.
    paths-ignore:
      - "public/store-logos/**"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}

      # Logos are served from raw.githubusercontent.com, not from the site —
      # keep them out of the deployed bundle (and out of the PWA cache).
      - name: Drop store logos from the deployed bundle
        run: rm -rf dist/store-logos

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


